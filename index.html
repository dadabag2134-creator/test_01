<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <title>오늘의 룰렛</title>
  <script>
    try {
      if (localStorage.getItem("today-roulette-theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #24231f;
      --muted: #89877f;
      --paper: #f8f7f3;
      --line: #e9e7e0;
      --orange: #f26a43;
      --accent-text: #d65b37;
      --surface: rgb(255 255 255 / 82%);
      --surface-solid: #fff;
      --surface-border: rgb(233 231 224 / 85%);
      --subtle-surface: #f4f3ef;
      --subtle-border: #f0eee8;
      --wheel-border: #efede6;
      --wheel-shadow: 0 12px 30px rgb(45 39 27 / 9%), inset 0 0 0 5px #fff;
      --button-bg: #24231f;
      --button-fg: #fff;
      --button-hover: #3a3832;
      --button-shadow: 0 7px 16px rgb(36 35 31 / 18%);
      --soft-text: #75736c;
      --subtle-text: #aaa79e;
      --scrollbar: #dedbd2;
      --remove-hover-bg: #fff0ec;
      --remove-hover-text: #c94c35;
      --reset-hover-text: #cd5939;
      --page-glow: rgb(255 249 234 / 90%);
      --overlay: rgb(32 30 26 / 42%);
      --pointer-color: #292823;
      --shadow: 0 20px 60px rgb(52 43 28 / 8%);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f1f0eb;
      --muted: #aaa9a2;
      --paper: #17191e;
      --line: #343740;
      --accent-text: #ff9a79;
      --surface: rgb(34 37 45 / 94%);
      --surface-solid: #252831;
      --surface-border: #353842;
      --subtle-surface: #30333c;
      --subtle-border: #3a3d46;
      --wheel-border: #41444d;
      --wheel-shadow: 0 12px 30px rgb(0 0 0 / 24%), inset 0 0 0 5px #252831;
      --button-bg: #f1eee7;
      --button-fg: #24231f;
      --button-hover: #dedbd3;
      --button-shadow: 0 7px 16px rgb(0 0 0 / 28%);
      --soft-text: #c3c1b9;
      --subtle-text: #8d909a;
      --scrollbar: #555964;
      --remove-hover-bg: #493038;
      --remove-hover-text: #ff9a9a;
      --reset-hover-text: #ff9a79;
      --page-glow: rgb(105 69 50 / 20%);
      --overlay: rgb(0 0 0 / 62%);
      --pointer-color: #f1eee7;
      --shadow: 0 20px 60px rgb(0 0 0 / 24%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 34%, var(--page-glow), transparent 42%),
        var(--paper);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: var(--orange);
      font-size: 16px;
    }

    .top-note { color: var(--muted); font-size: 12px; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .theme-toggle {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface-solid);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .theme-toggle:hover { background: var(--subtle-surface); transform: translateY(-1px); }
    .theme-icon { font-size: 15px; line-height: 1; }

    .intro {
      padding: 42px 0 34px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .eyebrow span { font-size: 16px; }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: -.065em;
    }

    .intro p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -.025em;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 24px;
      align-items: stretch;
    }

    .wheel-panel, .options-panel {
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .wheel-panel {
      display: flex;
      min-height: 570px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px 24px;
    }

    .wheel-wrap {
      position: relative;
      width: min(100%, 440px);
      aspect-ratio: 1;
      padding: 13px;
      border: 1px solid var(--wheel-border);
      border-radius: 50%;
      background: var(--surface-solid);
      box-shadow: var(--wheel-shadow);
    }

    .wheel-wrap::before {
      position: absolute;
      z-index: 2;
      top: -5px;
      left: 50%;
      width: 0;
      height: 0;
      border-right: 13px solid transparent;
      border-bottom: 0;
      border-left: 13px solid transparent;
      border-top: 25px solid var(--pointer-color);
      content: "";
      transform: translateX(-50%);
      filter: drop-shadow(0 3px 2px rgb(0 0 0 / 15%));
    }

    .wheel {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      border-radius: 50%;
      transform: rotate(0deg);
      transform-origin: center;
      transition: transform 5s cubic-bezier(.12, .72, .12, 1);
    }

    .wheel-label {
      fill: #fff;
      font-size: 16px;
      font-weight: 750;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: rgb(0 0 0 / 10%);
      stroke-linejoin: round;
      stroke-width: 2px;
      pointer-events: none;
    }

    .hub {
      fill: var(--surface-solid);
      stroke: rgb(31 30 26 / 10%);
      stroke-width: 2px;
    }

    .hub-dot { fill: #f26a43; }

    .spin-button {
      display: flex;
      min-width: 202px;
      height: 54px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 24px;
      border: 0;
      border-radius: 15px;
      color: var(--button-fg);
      background: var(--button-bg);
      box-shadow: var(--button-shadow);
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .spin-button:hover:not(:disabled) {
      background: var(--button-hover);
      box-shadow: var(--button-shadow);
      transform: translateY(-2px);
    }

    .spin-button:active:not(:disabled) { transform: translateY(0); }
    .spin-button:disabled { cursor: wait; opacity: .7; }
    .spin-button .spin-icon { font-size: 18px; }

    .options-panel { padding: 25px 23px 20px; }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.045em;
    }

    .count {
      padding: 5px 9px;
      border-radius: 20px;
      color: var(--soft-text);
      background: var(--subtle-surface);
      font-size: 11px;
      font-weight: 700;
    }

    .panel-subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .entry-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .entry-form input {
      width: 100%;
      min-width: 0;
      height: 43px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--ink);
      background: var(--surface-solid);
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
    }

    .entry-form input:focus {
      border-color: #ef9b80;
      box-shadow: 0 0 0 3px rgb(242 106 67 / 12%);
    }

    .add-button {
      flex: 0 0 43px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: var(--orange);
      font-size: 22px;
      cursor: pointer;
      transition: background .2s;
    }

    .add-button:hover { background: #dd5833; }

    .items {
      display: flex;
      min-height: 270px;
      max-height: 310px;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 1px 3px 1px 1px;
      scrollbar-color: var(--scrollbar) transparent;
      scrollbar-width: thin;
    }

    .item {
      display: flex;
      min-height: 41px;
      align-items: center;
      gap: 10px;
      padding: 0 8px 0 11px;
      border: 1px solid var(--subtle-border);
      border-radius: 11px;
      background: var(--surface-solid);
      animation: item-in .2s ease both;
    }

    .item-color {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
    }

    .item-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 13px;
      font-weight: 620;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-button {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: var(--subtle-text);
      background: transparent;
      font-size: 18px;
      cursor: pointer;
    }

    .remove-button:hover { color: var(--remove-hover-text); background: var(--remove-hover-bg); }

    .empty-note {
      display: grid;
      min-height: 150px;
      place-items: center;
      color: var(--subtle-text);
      font-size: 13px;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid var(--subtle-border);
    }

    .footer-hint { color: var(--muted); font-size: 11px; }

    .reset-button {
      padding: 5px 0 5px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }

    .reset-button:hover { color: var(--reset-hover-text); }

    .result {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--overlay);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility .2s;
    }

    .result.open { opacity: 1; visibility: visible; }

    .result-card {
      position: relative;
      width: min(100%, 380px);
      padding: 36px 28px 28px;
      border-radius: 24px;
      background: var(--surface-solid);
      box-shadow: 0 24px 70px rgb(0 0 0 / 20%);
      text-align: center;
      transform: translateY(12px) scale(.98);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1);
    }

    .result.open .result-card { transform: translateY(0) scale(1); }
    .result-emoji { font-size: 39px; }
    .result-caption { margin: 13px 0 7px; color: var(--muted); font-size: 13px; }
    .result-name { margin: 0; overflow-wrap: anywhere; font-size: 34px; letter-spacing: -.06em; }

    .result-close {
      width: 100%;
      height: 48px;
      margin-top: 25px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--orange);
      font-weight: 750;
      cursor: pointer;
    }

    .result-close:hover { background: #dd5833; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @keyframes item-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .app { width: min(100% - 32px, 540px); padding-top: 19px; }
      .topbar { padding-bottom: 17px; }
      .top-note { font-size: 11px; }
      .intro { padding: 34px 0 27px; }
      .intro p { font-size: 13px; }
      .workspace { grid-template-columns: 1fr; gap: 15px; }
      .wheel-panel { min-height: auto; padding: 26px 20px 23px; }
      .wheel-wrap { width: min(100%, 390px); }
      .spin-button { margin-top: 20px; }
      .options-panel { padding: 22px 19px 17px; }
      .items { min-height: 100px; max-height: 220px; }
    }

    @media (max-width: 420px) {
      .top-note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↻</span> 오늘의 룰렛</div>
      <div class="topbar-actions">
        <span class="top-note">작은 선택도 재미있게</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label"></span>
        </button>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow"><span aria-hidden="true">✦</span> DECISION MADE FUN</div>
      <h1 id="page-title">오늘은 뭘 해볼까요?</h1>
      <p>고민은 잠깐 내려두고, 룰렛에 맡겨보세요.</p>
    </section>

    <section class="workspace" aria-label="룰렛">
      <div class="wheel-panel">
        <div class="wheel-wrap">
          <svg id="wheel" class="wheel" viewBox="0 0 400 400" role="img" aria-label="선택 항목이 표시된 룰렛">
            <g id="wheel-slices"></g>
            <circle class="hub" cx="200" cy="200" r="20"></circle>
            <circle class="hub-dot" cx="200" cy="200" r="7"></circle>
          </svg>
        </div>
        <button id="spin-button" class="spin-button" type="button">
          <span class="spin-icon" aria-hidden="true">↻</span>
          <span>룰렛 돌리기</span>
        </button>
        <p id="wheel-status" class="sr-only" aria-live="polite"></p>
      </div>

      <aside class="options-panel" aria-labelledby="options-title">
        <div class="panel-heading">
          <h2 id="options-title">룰렛 항목</h2>
          <span id="item-count" class="count">0개</span>
        </div>
        <p class="panel-subtitle">원하는 항목을 추가하거나 빼보세요.<br>모든 칸은 같은 확률로 선택돼요.</p>
        <form id="entry-form" class="entry-form">
          <label class="sr-only" for="entry-input">새 항목 입력</label>
          <input id="entry-input" type="text" maxlength="24" placeholder="예: 떡볶이 먹기" autocomplete="off">
          <button class="add-button" type="submit" aria-label="항목 추가">+</button>
        </form>
        <div id="items" class="items" aria-label="룰렛 항목 목록"></div>
        <div class="panel-footer">
          <span class="footer-hint">2개 이상이면 돌릴 수 있어요</span>
          <button id="reset-button" class="reset-button" type="button">예시로 초기화</button>
        </div>
      </aside>
    </section>
  </main>

  <div id="result" class="result" role="dialog" aria-modal="true" aria-labelledby="result-name" aria-hidden="true">
    <div class="result-card">
      <div class="result-emoji" aria-hidden="true">🎉</div>
      <p class="result-caption">오늘의 선택은 바로</p>
      <h2 id="result-name" class="result-name"></h2>
      <button id="result-close" class="result-close" type="button">좋아요!</button>
    </div>
  </div>

  <script>
    (() => {
      const colors = ["#F26A43", "#F5A94F", "#6BBF9A", "#68A8D9", "#8B83D6", "#E8789A", "#E6BD55", "#55B9B0", "#DC7D54", "#7DAA68", "#B17BC1", "#D98E55"];
      const defaults = ["김치찌개", "돈까스", "마라탕", "파스타", "초밥", "오늘은 집밥"];
      const svgNS = "http://www.w3.org/2000/svg";
      const wheel = document.querySelector("#wheel");
      const slices = document.querySelector("#wheel-slices");
      const list = document.querySelector("#items");
      const count = document.querySelector("#item-count");
      const spinButton = document.querySelector("#spin-button");
      const status = document.querySelector("#wheel-status");
      const result = document.querySelector("#result");
      const resultName = document.querySelector("#result-name");
      const input = document.querySelector("#entry-input");
      const themeButton = document.querySelector("#theme-toggle");
      const storageKey = "today-roulette-items";
      const themeStorageKey = "today-roulette-theme";
      let items;
      let spinning = false;
      let rotation = 0;
      let spinTimer;

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        items = Array.isArray(saved) && saved.every(item => typeof item === "string")
          ? saved.slice(0, 100)
          : [...defaults];
      } catch {
        items = [...defaults];
      }

      function save() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(items));
        } catch {
          status.textContent = "항목을 저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요.";
        }
      }

      function applyTheme(theme) {
        const isDark = theme === "dark";
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        themeButton.setAttribute("aria-pressed", String(isDark));
        themeButton.setAttribute("aria-label", isDark ? "라이트 모드로 전환" : "다크 모드로 전환");
        themeButton.querySelector(".theme-icon").textContent = isDark ? "☀" : "☾";
        themeButton.querySelector(".theme-label").textContent = isDark ? "라이트 모드" : "다크 모드";
        document.querySelector('meta[name="theme-color"]').content = isDark ? "#17191e" : "#f8f7f3";
      }

      themeButton.addEventListener("click", () => {
        const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(theme);
        try {
          localStorage.setItem(themeStorageKey, theme);
        } catch {
          status.textContent = "테마는 변경했지만 설정을 저장할 수 없어요.";
        }
      });

      function point(angle, radius) {
        const radians = (angle * Math.PI) / 180;
        return [200 + Math.cos(radians) * radius, 200 + Math.sin(radians) * radius];
      }

      function renderWheel() {
        slices.replaceChildren();
        const step = items.length ? 360 / items.length : 360;
        if (items.length === 1) {
          const circle = document.createElementNS(svgNS, "circle");
          circle.setAttribute("cx", "200");
          circle.setAttribute("cy", "200");
          circle.setAttribute("r", "188");
          circle.setAttribute("fill", colors[0]);
          circle.setAttribute("stroke", "#fff");
          circle.setAttribute("stroke-width", "2");
          slices.append(circle);
          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("class", "wheel-label");
          label.setAttribute("x", "200");
          label.setAttribute("y", "200");
          label.textContent = items[0].length > 18 ? `${items[0].slice(0, 17)}…` : items[0];
          slices.append(label);
        } else items.forEach((item, index) => {
          const start = -90 + index * step;
          const end = start + step;
          const from = point(start, 188);
          const to = point(end, 188);
          const path = document.createElementNS(svgNS, "path");
          const largeArc = step > 180 ? 1 : 0;
          path.setAttribute("d", `M 200 200 L ${from[0]} ${from[1]} A 188 188 0 ${largeArc} 1 ${to[0]} ${to[1]} Z`);
          path.setAttribute("fill", colors[index % colors.length]);
          path.setAttribute("stroke", "#fff");
          path.setAttribute("stroke-width", "2");
          slices.append(path);

          const label = document.createElementNS(svgNS, "text");
          const mid = start + step / 2;
          const [x, y] = point(mid, items.length > 8 ? 128 : 126);
          label.setAttribute("class", "wheel-label");
          label.setAttribute("x", x);
          label.setAttribute("y", y);
          label.setAttribute("transform", `rotate(${mid + 90} ${x} ${y})`);
          label.textContent = item.length > 9 ? `${item.slice(0, 8)}…` : item;
          slices.append(label);
        });
        count.textContent = `${items.length}개`;
        spinButton.disabled = items.length < 2 || spinning;
        wheel.setAttribute("aria-label", items.length ? `룰렛: ${items.join(", ")}` : "비어 있는 룰렛");
      }

      function renderList() {
        list.replaceChildren();
        input.disabled = spinning;
        document.querySelector("#entry-form button").disabled = spinning;
        document.querySelector("#reset-button").disabled = spinning;
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty-note";
          empty.textContent = "항목을 추가해 룰렛을 채워보세요.";
          list.append(empty);
        }
        items.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = "item";
          const dot = document.createElement("span");
          dot.className = "item-color";
          dot.style.backgroundColor = colors[index % colors.length];
          dot.setAttribute("aria-hidden", "true");
          const name = document.createElement("span");
          name.className = "item-name";
          name.textContent = item;
          const remove = document.createElement("button");
          remove.className = "remove-button";
          remove.type = "button";
          remove.textContent = "×";
          remove.disabled = spinning;
          remove.setAttribute("aria-label", `${item} 삭제`);
          remove.addEventListener("click", () => {
            items.splice(index, 1);
            save();
            render();
          });
          row.append(dot, name, remove);
          list.append(row);
        });
      }

      function render() {
        renderWheel();
        renderList();
      }

      document.querySelector("#entry-form").addEventListener("submit", event => {
        event.preventDefault();
        if (spinning) return;
        const value = input.value.trim();
        if (!value) {
          input.focus();
          return;
        }
        if (items.length >= 100) {
          status.textContent = "항목은 최대 100개까지 추가할 수 있어요.";
          return;
        }
        items.push(value);
        input.value = "";
        save();
        render();
        input.focus();
      });

      document.querySelector("#reset-button").addEventListener("click", () => {
        if (spinning) return;
        items = [...defaults];
        rotation = 0;
        wheel.style.transition = "none";
        wheel.style.transform = "rotate(0deg)";
        requestAnimationFrame(() => { wheel.style.transition = ""; });
        save();
        render();
      });

      function closeResult() {
        result.classList.remove("open");
        result.setAttribute("aria-hidden", "true");
        spinButton.focus();
      }

      document.querySelector("#result-close").addEventListener("click", closeResult);
      result.addEventListener("click", event => {
        if (event.target === result) closeResult();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && result.classList.contains("open")) closeResult();
      });

      spinButton.addEventListener("click", () => {
        if (spinning || items.length < 2) return;
        spinning = true;
        render();
        const winner = Math.floor(Math.random() * items.length);
        const winnerItem = items[winner];
        const step = 360 / items.length;
        const target = 360 - (winner + 0.5) * step;
        const current = ((rotation % 360) + 360) % 360;
        const offset = (target - current + 360) % 360;
        rotation += 360 * (5 + Math.floor(Math.random() * 3)) + offset;
        wheel.style.transform = `rotate(${rotation}deg)`;
        status.textContent = "룰렛을 돌리고 있어요.";
        spinTimer = window.setTimeout(() => {
          spinning = false;
          render();
          resultName.textContent = winnerItem;
          result.classList.add("open");
          result.setAttribute("aria-hidden", "false");
          status.textContent = `오늘의 선택은 ${winnerItem}입니다.`;
          document.querySelector("#result-close").focus();
        }, 5100);
      });

      window.addEventListener("pagehide", () => window.clearTimeout(spinTimer));
      applyTheme(document.documentElement.dataset.theme);
      render();
    })();
  </script>
</body>
</html>
